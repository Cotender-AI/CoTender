# Local development stack: docker compose up
# API http://localhost:8000/docs · Frontend http://localhost:3000 · Postgres localhost:5432
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inteltps
      POSTGRES_PASSWORD: inteltps
      POSTGRES_DB: inteltps
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inteltps"]
      interval: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000", "10001:10001"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://inteltps:inteltps@postgres:5432/inteltps
      TEST_DATABASE_URL: postgresql+psycopg://inteltps:inteltps@postgres:5432/inteltps_test
      DOCS_DIR: /docs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./docs:/docs
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      azurite: { condition: service_started }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://inteltps:inteltps@postgres:5432/inteltps
    command: python -m app.worker
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      azurite: { condition: service_started }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  frontend_node_modules:
