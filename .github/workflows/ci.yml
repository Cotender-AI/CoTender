name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inteltps
          POSTGRES_PASSWORD: inteltps
          POSTGRES_DB: inteltps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inteltps" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://inteltps:inteltps@localhost:5432/inteltps_test
      TEST_DATABASE_URL: postgresql+psycopg://inteltps:inteltps@localhost:5432/inteltps_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get install -y --no-install-recommends libmagic1
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: API contract is up to date (docs/openapi.json)
        run: python -m scripts.export_openapi --check
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image builds (one image for api + worker)
        run: docker build -t cotender-api backend
