[project]
name = "inteltps"
version = "0.1.0"
description = "IntelTPS - Intelligent Tender Preparation System (API + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.17",
    "slowapi>=0.1.9,<0.2",
    "azure-storage-blob>=12.24,<13",
    "azure-storage-queue>=12.12,<13",
    # processing libraries (worker runs from the same image)
    "python-magic>=0.4.27,<0.5",
    "pymupdf>=1.24,<1.25",
    "pdfplumber>=0.11,<0.12",
    "openpyxl>=3.1,<3.2",
    "pandas>=2.2,<2.3",
    "python-docx>=1.1,<1.2",
    "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
files = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
    "app.core.security.require_role",
]
